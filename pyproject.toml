[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tempcleaner"
version = "1.2.0"
description = "Trova automaticamente le cartelle Temp di Windows e ne elimina il contenuto in sicurezza."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "makaDv" }]
keywords = ["windows", "temp", "cleanup", "cleaner", "disk-space"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Console",
    "Topic :: System :: Filesystems",
]

[project.urls]
Repository = "https://github.com/makaDv/TempCleaner"

[project.scripts]
tempcleaner = "tempcleaner.cli:main"

[tool.setuptools]
packages = ["tempcleaner"]
