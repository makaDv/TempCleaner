name: Build e release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release (es. v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -v tests

      - name: Crea TempCleaner.zip
        run: python packaging/build.py dist

      - name: Prova il pacchetto
        shell: pwsh
        run: |
          Expand-Archive dist/TempCleaner.zip -DestinationPath prova
          Get-ChildItem prova | Select-Object -ExpandProperty Name
          cmd /c "prova\Avvia TempCleaner.cmd" --version
          cmd /c "prova\Avvia TempCleaner.cmd" -s user -n --no-color
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pubblica la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/TempCleaner.zip dist/TempCleaner.zip.sha256 \
            --title "TempCleaner $TAG" --generate-notes
