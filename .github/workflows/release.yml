name: Build e release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release (es. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -v tests

      - name: Compila TempCleaner.exe
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --onefile --console --name TempCleaner --version-file packaging/version_info.txt launcher.py

      - name: Prova l'eseguibile
        run: |
          dist\TempCleaner.exe --version
          dist\TempCleaner.exe -s user -n --no-color

      - name: Checksum SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/TempCleaner.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TempCleaner.exe" | Out-File -Encoding ascii dist/TempCleaner.exe.sha256
          Get-Content dist/TempCleaner.exe.sha256

      - name: Pubblica la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/TempCleaner.exe dist/TempCleaner.exe.sha256 \
            --title "TempCleaner $TAG" --generate-notes
